name: Wind Frontier Online Foundation
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: wf-online-foundation
  cancel-in-progress: false
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore source files
        shell: bash
        run: |
          set -Eeuo pipefail
          base64 -d <<'WF_SOURCE' | tar -xz
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          WF_SOURCE
      - name: Install protocol test dependencies
        run: python3 -m pip install -r online/requirements.txt PyYAML
      - name: Simulated sessions and mailbox reader tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s online/tests -v 2>&1 | tee /tmp/wf-online-tests.txt
          node --test online/tests/bridge.test.mjs 2>&1 | tee -a /tmp/wf-online-tests.txt
          python3 online/install_rom_bridge.py
      - name: Install GBA build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3 git
      - name: Restore proven 0.3.2 then build telemetry ROM
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY_BUILD'
          import base64,gzip,re,yaml
          from pathlib import Path
          workflow=yaml.safe_load(Path('.github/workflows/wind-frontier-alpha-0-3-2-crystals.yml').read_text())
          run=workflow['jobs']['build']['steps'][2]['run']
          encoded=run.split("<<'WF032_SCRIPT'\n",1)[1].split('\nWF032_SCRIPT',1)[0]
          source=gzip.decompress(base64.b64decode(encoded)).decode()
          marker='echo "::group::Build GBA ROM"'
          assert source.count(marker)==1
          Path('/tmp/wf-restore-only.sh').write_text(source.split(marker)[0])
          PY_BUILD
          bash /tmp/wf-restore-only.sh
          python3 online/install_rom_bridge.py
          touch .histignore
          make modern -j2 > /tmp/wf-online-build.log 2>&1 || { tail -n 100 /tmp/wf-online-build.log; exit 1; }
          test -s pokemonworld.gba
          mkdir -p wf_online_dist
          cp pokemonworld.gba wf_online_dist/wind-frontier-coop-foundation-telemetry.gba
          arm-none-eabi-nm -S pokemonworld.elf | awk '$4 == "gWfNetMailbox" { print }' > wf_online_dist/mailbox-symbol.txt
          test -s wf_online_dist/mailbox-symbol.txt
          tar -czf wf_online_dist/online-foundation-source.tar.gz online include/wf_net.h src/wf_net.c docs/wind_frontier/ONLINE_FOUNDATION.md
          cp /tmp/wf-online-tests.txt wf_online_dist/
          cp docs/wind_frontier/ONLINE_FOUNDATION.md wf_online_dist/
          sha256sum wf_online_dist/*.gba > wf_online_dist/ROM_SHA256.txt
      - name: Publish foundation artifact (not playable multiplayer)
        uses: actions/upload-artifact@v4
        with:
          name: wf-online-foundation-telemetry
          path: wf_online_dist/
          if-no-files-found: error
      - name: Publish build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wf-online-foundation-diagnostics
          path: |
            /tmp/wf-online-tests.txt
            /tmp/wf-online-build.log
          if-no-files-found: ignore
