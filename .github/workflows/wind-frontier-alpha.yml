      - name: Corrigir inicializadores dos textos de geracoes
        run: |
          python3 - <<'PYFIX'
          from pathlib import Path
          p = Path('src/starter_choose.c')
          s = p.read_text()
          anchor = 'static const u8 *const sText_WfGeneration[WF_STARTER_GENERATIONS] ='
          assert s.count(anchor) == 1, 'Tabela de geracoes nao encontrada ou duplicada'
          regions = ['KANTO', 'JOHTO', 'HOENN', 'SINNOH', 'UNOVA', 'KALOS', 'ALOLA', 'GALAR', 'PALDEA']
          definitions = '\n'.join(f'static const u8 sText_WfGen{i}[] = _("GERACAO {i}/9 - {name}");' for i, name in enumerate(regions, 1))
          for i, name in enumerate(regions, 1):
              old = f'    _("GERACAO {i}/9 - {name}"),'
              assert s.count(old) == 1, f'Texto da geracao {i} nao encontrado'
              s = s.replace(old, f'    sText_WfGen{i},')
          p.write_text(s.replace(anchor, definitions + '\n' + anchor))
          print('Corrigidos os nove textos de geracao do seletor de iniciais')
          PYFIX

      - name: Testar sistemas e configuracoes
        run: |
          python3 test/overworld/ValidateWindFrontierStarters.py
          python3 test/wind_frontier/validate_cosmetics.py
          python3 test/overworld/ValidateGen13.py
          python3 test/overworld/ValidateScripts.py
          python3 test/overworld/ValidateConfigRules.py

      - name: Compilar ROM modificada
        shell: bash
        run: |
          if ! make modern -j2 > build.log 2>&1; then
            echo '=== ERROS DA COMPILACAO (resumo) ==='
            grep -E 'error:|fatal error:|make: \*\*\*|undefined reference|Error [0-9]+' build.log | head -n 60 || true
            echo '=== ULTIMAS 50 LINHAS ==='
            tail -n 50 build.log
            exit 1
          fi
          echo 'Compilacao concluida. Ultimas linhas:'
          tail -n 12 build.log

      - name: Guardar log caso a compilacao falhe
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wind-frontier-build-errors
          path: build.log
          if-no-files-found: ignore

      - name: Preparar ROM de teste
        run: |
          test -s pokemonworld.gba
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pokemonworld.gba')
          data=p.read_bytes()
          if len(data)<192 or len(data)>32*1024*1024:
              raise SystemExit('ROM invalida ou excede o limite de 32 MiB: %s bytes' % len(data))
          if not data[0xA0:0xAC].strip(b'\0 '):
              raise SystemExit('Cabecalho GBA sem titulo interno')
          print('ROM gerada, bytes:',len(data),'titulo:',repr(data[0xA0:0xAC]))
          PY
          cp pokemonworld.gba windfrontier-alpha-0-2.gba
          sha256sum windfrontier-alpha-0-2.gba > ROM_SHA256.txt

      - name: Disponibilizar ROM para testar no Android
        uses: actions/upload-artifact@v4
        with:
          name: wind-frontier-alpha-0-2
          path: |
            windfrontier-alpha-0-2.gba
            ROM_SHA256.txt
          if-no-files-found: error
