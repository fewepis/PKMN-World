name: Wind Frontier Alpha 0.3.2 - Crystals + Boss Balance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Wind Frontier Alpha 0.3.2
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Pokemon World
        uses: actions/checkout@v4
      - name: Install GBA toolchain and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3 git
      - name: Apply patches, validate and compile
        shell: bash
        run: bash .github/scripts/wind_frontier_alpha_032_build.sh
      - name: Publish ROM for testing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wind-frontier-alpha-0-3-2-crystals
          path: wf_dist/*.gba
          if-no-files-found: error
