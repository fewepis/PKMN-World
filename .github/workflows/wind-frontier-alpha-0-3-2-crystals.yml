name: Wind Frontier Alpha 0.3.2 - Crystals + Boss Balance (Single File)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Wind Frontier Alpha 0.3.2
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Pokemon World
        uses: actions/checkout@v4
      - name: Install GBA toolchain and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3 git
      - name: Restore patches and build ROM
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/wf032_script.b64 <<'WF032_SCRIPT'
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          WF032_SCRIPT
          base64 -d /tmp/wf032_script.b64 | gzip -dc > /tmp/wf032_build.sh
          echo "Wind Frontier builder restored ($(wc -c </tmp/wf032_build.sh) bytes)"
          bash -n /tmp/wf032_build.sh
          bash /tmp/wf032_build.sh
      - name: Publish ROM for testing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wind-frontier-alpha-0-3-2-crystals
          path: wf_dist/*.gba
          if-no-files-found: error
